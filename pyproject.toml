[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-the-lion"
version = "0.1.0"
description = "RAG chatbot over the official Receita Federal income tax (IRPF) Q&A document"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-chroma>=0.2",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# Local multilingual embeddings (pulls in torch; not needed to run the tests).
local-embeddings = [
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
ask-the-lion = "ask_the_lion.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
